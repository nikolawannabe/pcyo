baseURL = 'https://pcyo.kids/'
languageCode = 'en-us'
title = 'Peninsula Community Youth Orchestra'
theme = 'ananke'

# Don't generate /tags/, /categories/ and their term pages
disableKinds = ["taxonomy", "term"]

[[menu.main]]
name = "Events"
pageRef = "events" # Reference to the folder
weight = 1

[[menu.main]]
  name = "About"
  url = "/about"
  weight = 2

[[menu.main]]
  name = "New Students"
  url = "/classes"
  weight = 3

[[menu.main]]
  name = "Current Students"
  url = "/current-students"
  weight = 4

[[menu.main]]
  name = "Donate"
  url = "/donate"
  weight = 5

[params]
background_color_class = "bg-light-yellow"
site_logo = "images/white-note.png"
favicon = "images/purple-note.png"
# Extra stylesheets from assets/ananke/css/, bundled into the theme's main.css in this order
# (brand.css first: it defines the brand color variables the others use).
custom_css = ["brand.css", "events.css", "footer.css", "home.css", "calendar.css", "current-students.css", "about.css", "donate.css",
              "class-status.css", "class-schedule.css", "class-finder.css", "term-timeline.css", "term-classes.css", "class-page.css"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  # Allows all content media types, including HTML files
  allowContent = ['.*']

# Let Hugo resize the stickers (without background) for event pages (data/stickers.yaml) while they stay in
# static/ for the branding page. Adding any assets mount replaces the default one, so assets/ is listed again first.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/merchandise/Sticker/transparent"
    target = "assets/stickers"
