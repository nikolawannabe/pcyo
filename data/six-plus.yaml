faq:
  heading: Questions families ask
  items:            # q: the question; a: the answer (Markdown links work). {tuition} becomes the tuition.
    - q: Who are these classes for?
      a: Beginner and intermediate students, in both Port Angeles and Sequim. Students who can't read yet, or can't yet do focused work for 30 minutes, should join our [Sprouts](/classes/sprouts/) classes instead.
    - q: My child is 6 or 7. Should they join a 6+ Beginner class or Suzuki Sprouts?
      a: The two overlap on purpose, so each child can join the group that fits them best, whatever their age. 6+ Beginner classes teach violin, viola, cello or bass and start reading music right away, so they suit children who can read and are ready to focus for about 30–45 minutes. [Suzuki Sprouts](/classes/sprouts/#suzuki-sprouts) gently introduces violin through songs, games and movement, with parents taking part in every class, and is a great fit for children who aren't reading yet or who do best with short, active activities. Not sure? Email the registrar and we'll help you decide.
    - q: When are classes?
      a: Twice a week, Mondays and Wednesdays, after school (see [Schedule & joining](#schedule) for times and places). Port Angeles students who want extra support for their school orchestra classes may choose to come once a week.
    - q: When can my student start?
      a: The classes build through the year, so students with no musical background should join in the fall and plan to stay the whole year. Students switching instruments, or with school or private-lesson experience, may join mid-year or mid-term if there's room.
    - q: How long will my student be in these classes?
      a: About a year in Beginner Strings, then about two years mastering the basics in Intermediate Strings.
    - q: Is my student too skilled for this group?
      a: Students who have finished at least 3 years of classes (ours or school orchestra) or private lessons are likely ready for [Youth Orchestra](/classes/youth-orchestra/). High school students are likely ready for the [Sequim Community Orchestra](https://sequimcommunityorchestra.org).
    - q: How much does it cost?
      a: "${tuition} per term, with three terms a year (Fall, Winter and Spring) plus an optional Holiday Session; see [Schedule & joining](#schedule) for dates. Scholarships are available, and no student is turned away for inability to pay."

