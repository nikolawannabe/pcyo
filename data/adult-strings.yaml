cards:
  heading: Our labs
  items:            # teacher: shows their photo from data/home.yaml; text: paragraphs (Markdown links work)
    - name: Violin Lab
      teacher: Christine Faught
      meta: Beginner group started January 2026 in Port Angeles.
      text:
        - For adults who want to learn violin from the ground up. We develop essential violin skills using the Suzuki method as a guiding framework, drawing on other approaches as they serve the group.
        - Tone, listening, rhythm and healthy beginner technique come first. Questions are welcome, curiosity is encouraged, and mistakes are part of learning. No musical experience needed.
      link: { label: "Time and place ↓", url: "#schedule" }
    - name: Viola Lab
      teacher: Anne Burns
      meta: Beginner group started March 2026 in Sequim.
      text:
        - For absolute beginner violists, folks with some viola experience, and students switching from other instruments. We cover note reading, learning a new clef, how viola technique differs from violin, and musical discovery.
        - The only requirement is a desire to learn the viola. Join us for fun and friendship.
      link: { label: "Time and place ↓", url: "#schedule" }
    - name: Cello Lab
      meta: Start date to be decided.
      text:
        - Want to learn cello? Tell us where and when you'd like to meet in the [Adult Strings Interest Survey](https://forms.gle/qoUm6fbLmfrrVxAx8).
      link: { label: Take the survey, url: "https://forms.gle/qoUm6fbLmfrrVxAx8" }

