callout:
  heading: Want a lab for your instrument or town?
  text: We start a new group when enough people are interested in a town and time and a qualified teacher is available, usually no more than once a year per instrument. The current labs are for their existing students, so the survey is the way to get the next one started.
  button: Take the interest survey
  url: "https://forms.gle/qoUm6fbLmfrrVxAx8"

faq:
  heading: Questions adults ask
  items:            # q: the question; a: the answer (Markdown links work)
    - q: Who are these labs for?
      a: Adults and students 13 and up with no experience on the lab's instrument. People switching from other instruments are welcome and encouraged to join.
    - q: Should I take private lessons too?
      a: Yes. It isn't required, but we strongly encourage meeting with a teacher one-on-one a second time each week. Private lessons are arranged directly with the teacher, outside these classes.
    - q: Where do the labs meet?
      a: In Port Angeles or Sequim, depending on where most of a group's students are.
    - q: When do the labs meet?
      a: Weekly, at a time set by the preferences of the group's students. It may be daytime, evening or weekends.
    - q: Can I start if I missed the registration date?
      a: You can join a new group until the third week of class, with the registrar's permission. After that, we'll refer you to the teacher to talk about prerequisites. If there's room, you may also join after the first term if you meet the group's technical requirements.
    - q: How long do the labs run?
      a: Students generally stay with their group until they have the skills to join the Sequim Community Orchestra. Progress depends on the group. You enroll one term at a time, and each term is eight weeks long.
    - q: What if too many students drop between terms?
      a: If a group falls below three students, the teacher may combine it with another group, combine it with another instrument's group with similar prerequisites, or offer one-on-one lessons at their own rates.
    - q: When will a new group start for my instrument?
      a: When enough people are interested in a particular town and time, and a qualified teacher is available. To tell us you're interested, fill out the [Adult Strings Interest Survey](https://forms.gle/qoUm6fbLmfrrVxAx8). We generally don't start a new group for an instrument more than once a year.

contact: Questions about registration? Email our registrar.
