# One entry per class. Fields:
#   terms: which terms it meets (default: fall, winter, spring)
#   join:  when NEW students may sign up
#          open        any term, no experience needed
#          skills      any term, if they have the prerequisite skills (see prereq)
#          [fall]      only in the listed term(s); continuing students the rest of the year
#          continuing  returning students only
#   new_students: for a "continuing" class, the term new students should look at instead (linked on the site)
#   days / start / length: when it meets. The site writes every time from these, so they can't drift apart:
#          days: [Mon, Wed]   start: "4:30pm"   length: 45   (minutes; leave out if not known yet)
#          Classes that only meet in an optional term (Holiday Session) also list their dates,
#          worked out from the term dates and days off.
#   location: where it meets (shown with a map link)
#   exp_min / exp_max: years of experience the class suits (0 = brand new); the experience slider uses them.
#          Leave out for "any experience".
#   ages:  shown to families; the age slider reads the numbers in it ("3–7", "6+", "Children 0–6").
#          Add age_min / age_max when the text has no numbers or you want to override it.
# Holiday Session classes are separate entries with terms: [holiday].

- name: Sound Sprouts
  town: Sequim
  teacher: Christine Faught
  ages: "0–6"
  exp_min: 0
  exp_max: 0          # only for students with no experience yet
  days: [Mon]
  start: "11:00am"
  length: 50
  location: "Swisher Hall, 506 N Blake Ave, Sequim"
  link: /classes/sprouts/#sound-sprouts
  join: open
  description: Early music education with fun movement and songs for parent and child. A good fit for children who aren't reading yet.

