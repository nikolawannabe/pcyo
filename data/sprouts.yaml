faq:
  heading: Questions families ask
  items:            # q: the question; a: the answer (Markdown links work)
    - q: What's the difference between Suzuki Sprouts and Sound Sprouts?
      a: They have a lot in common. In both, parents are part of every class, and families sing, move, play rhythm instruments and listen to great music together. The main difference is the violin. **Sound Sprouts** (ages 0–6) is all about music and movement, with no instrument needed, while **Suzuki Sprouts** (ages 3–7) also gently introduces the violin in a way that's right for young children.
    - q: Will my Suzuki Sprout be handed a violin at their first class?
      a: No. Most students begin on a box violin and mock bow that we provide. Over the first term they learn violin skills, including how to handle the instrument and basic technique. When the parent and teacher agree they're ready, they may borrow a violin from our [instrument library](/instruments/#instrument-library), or rent or buy one elsewhere.
    - q: My child is 6 or 7. Should they join Suzuki Sprouts or a 6+ Beginner class?
      a: Suzuki Sprouts (ages 3–7) and our [6+ Beginner classes](/classes/6-plus-classes/) overlap on purpose, so each child can join the group that fits them best, whatever their age. Suzuki Sprouts teaches violin by ear through songs, games and movement, and suits children who aren't reading yet or who do best with short, active activities. 6+ Beginner classes teach violin, viola, cello or bass and start reading music right away, so they suit children who can read and are ready to focus for about 30–45 minutes. Not sure? Email the registrar and we'll help you decide.
    - q: How much does it cost?
      a: "${tuition} per term, with $50 due at registration and the rest due a week before class starts. Scholarships are available, and no student is turned away for inability to pay."

