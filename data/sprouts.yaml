cards:
  heading: Our two Sprouts classes
  items:            # id: the anchor other pages link to; logo: in static/images/; text: paragraphs (Markdown links work)
    - name: Suzuki Sprouts
      id: suzuki-sprouts
      logo: /images/suzuki-sprouts-logo.png
      teacher: Christine Faught
      meta: Ages 3–7 · a joyful first step to the violin. New students start in January 2027 in Port Angeles.
      text:
        - This weekly class blends rhythm, song and playful movement to build the coordination, listening and focus skills that are the foundation for violin study. Children sing, tap, move and explore music with scarves, rhythm instruments and song stories in a warm, structured setting.
        - It builds timing, motor control and musical awareness through familiar songs like Frog in the Meadow and Lightly Row, classical favorites like Fingal's Cave, and pieces from the Suzuki repertoire. Each class follows a consistent format that balances predictability with discovery, so children feel confident, attentive and excited to learn.
      link: { label: "Schedule, places and when to join ↓", url: "#schedule" }
    - name: Sound Sprouts
      id: sound-sprouts
      logo: /images/sound-sprouts-logo.png
      teacher: Christine Faught
      meta: Ages 0–6 · a research-based introduction to music for young children and their families. Join any time.
      text:
        - Sound Sprouts brings real music (classical, folk and traditional songs) into children's lives through play, movement and family connection. From infancy through early childhood, it develops listening, rhythm, coordination and connection with others, and a lifelong love of great music.
        - Classes combine singing, rhythm instruments, storytelling and imaginative movement to masterpieces by Bach, Handel and others. Every activity engages the whole child, through active listening, singing in tune and keeping a steady beat.
        - Parents take part alongside their children and pick up simple ways to make music part of daily life. No musical background needed, just a willingness to sing, move and connect. It's not entertainment; it's education made joyful.
      link: { label: "Schedule, places and when to join ↓", url: "#schedule" }

