{{ define "main" }}
  {{- /* The /events/ page: same as _default/list.html, but in date order, soonest first. */ -}}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy nested-links {{ $.Param "text_color" | compare.Default "mid-gray" }}">
      {{- .Content -}}
    </section>
    <section class="flex-ns mt5 flex-wrap justify-around">
      {{ range (.Paginate (sort .Pages ".Params.eventStartDate" "asc")).Pages }}
        <div class="w-100 w-30-l mb4 relative">
          {{ .Render "summary" }}
        </div>
      {{ end }}
    </section>
    {{- template "_internal/pagination.html" . -}}
  </article>
{{ end }}
