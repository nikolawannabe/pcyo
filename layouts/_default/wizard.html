<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PCYO Placement Wizard</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    .wizard-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 550px;
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .wizard-header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .wizard-header h2 {
      margin: 0 0 0.5rem 0;
      color: var(--primary);
    }

    .progress-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .progress-step {
      flex: 1;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      transition: background 0.3s ease;
    }

    .progress-step.active {
      background: var(--primary);
    }

    .step-content {
      display: none;
    }

    .step-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input[type="number"], select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .radio-option {
      display: flex;
      align-items: center;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .radio-option:hover {
      background-color: #f1f5f9;
    }

    .radio-option input {
      margin-right: 0.75rem;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
    }

    button {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .result-badge {
      display: inline-block;
      background: #dbeafe;
      color: var(--primary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .result-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      background: #fafafa;
    }

    .result-card h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>

<div class="wizard-card">
  <div class="wizard-header">
    <h2>PCYO Placement Finder</h2>
    <p>Find the right ensemble or program for your student</p>
  </div>

  <div class="progress-bar">
    <div class="progress-step active" id="p-step-1"></div>
    <div class="progress-step" id="p-step-2"></div>
    <div class="progress-step" id="p-step-3"></div>
    <div class="progress-step" id="p-step-4"></div>
  </div>

  <form id="pcyo-wizard">
    <!-- Step 1: Location -->
    <div class="step-content active" id="step-1">
      <div class="form-group">
        <label>Which town would you prefer to take classes in?</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="location" value="Port Angeles" required checked>
            Port Angeles (First United Methodist Church)
          </label>
          <label class="radio-option">
            <input type="radio" name="location" value="Sequim">
            Sequim (Swisher Hall / Trinity United Methodist Church)
          </label>
          <label class="radio-option">
            <input type="radio" name="location" value="Either">
            Either location works for us
          </label>
        </div>
      </div>
    </div>

    <!-- Step 2: Age -->
    <div class="step-content" id="step-2">
      <div class="form-group">
        <label for="student-age">Student's Current Age:</label>
        <input type="number" id="student-age" min="0" max="99" value="7" required>
      </div>
    </div>

    <!-- Step 3: Prior Experience -->
    <div class="step-content" id="step-3">
      <div class="form-group">
        <label>Prior Musical / String Experience:</label>
        <div class="radio-group">
          <label class="radio-option">
            <input type="radio" name="experience" value="none" checked>
            None / Complete Beginner
          </label>
          <label class="radio-option">
            <input type="radio" name="experience" value="early-suzuki">
            Pre-reading / Basic Suzuki exploration
          </label>
          <label class="radio-option">
            <input type="radio" name="experience" value="under-1-year">
            Less than 1 year of playing or school string club
          </label>
          <label class="radio-option">
            <input type="radio" name="experience" value="1-plus-years">
            1 to 2+ years (reads basic staff notation)
          </label>
          <label class="radio-option">
            <input type="radio" name="experience" value="adult-learner">
            Adult learner (youth at heart!)
          </label>
        </div>
      </div>
    </div>

    <!-- Step 4: Recommendations -->
    <div class="step-content" id="step-4">
      <h3>Recommended Placement</h3>
      <div id="recommendation-output"></div>
    </div>

    <!-- Wizard Navigation Buttons -->
    <div class="btn-group">
      <button type="button" id="prev-btn" class="btn-secondary" style="display: none;">Back</button>
      <button type="button" id="next-btn" class="btn-primary">Next</button>
    </div>
  </form>
</div>

<script>
  let currentStep = 1;
  const totalSteps = 4;

  const nextBtn = document.getElementById('next-btn');
  const prevBtn = document.getElementById('prev-btn');

  nextBtn.addEventListener('click', () => {
    if (currentStep < totalSteps) {
      currentStep++;
      updateWizard();
    } else {
      // Final submission action (e.g. redirecting to registration form)
      alert('Proceeding to registration form...');
    }
  });

  prevBtn.addEventListener('click', () => {
    if (currentStep > 1) {
      currentStep--;
      updateWizard();
    }
  });

  function updateWizard() {
    // Hide/Show step contents
    document.querySelectorAll('.step-content').forEach((el, index) => {
      el.classList.toggle('active', index + 1 === currentStep);
    });

    // Update progress bars
    for (let i = 1; i <= totalSteps; i++) {
      const stepBar = document.getElementById(`p-step-${i}`);
      stepBar.classList.toggle('active', i <= currentStep);
    }

    // Button states
    prevBtn.style.display = currentStep === 1 ? 'none' : 'inline-block';
    
    if (currentStep === totalSteps) {
      calculatePlacement();
      nextBtn.innerText = 'Register Now';
    } else {
      nextBtn.innerText = 'Next';
    }
  }

  function calculatePlacement() {
    const age = parseInt(document.getElementById('student-age').value, 10);
    const exp = document.querySelector('input[name="experience"]:checked').value;
    const location = document.querySelector('input[name="location"]:checked').value;

    let rec = {
      group: '',
      tier: '',
      details: '',
      locationNote: `Preferred location: <strong>${location}</strong>`
    };

    // Rule Logic based on PCYO Hierarchy
    if (exp === 'adult-learner' || age >= 13) {
      if (age >= 13 && exp === '1-plus-years') {
        rec.tier = 'Tier 3: Core Orchestra & Adult Labs';
        rec.group = 'Youth Orchestra or Adult Violin/Viola Labs';
        rec.details = 'Suitable for teen musicians ready for advanced multi-part arrangements or adults learning alongside their families.';
      } else {
        rec.tier = 'Tier 4: Adult Labs';
        rec.group = 'Adult Violin & Viola Labs';
        rec.details = 'Designed specifically for adult learners ("youths at heart") and parents building skills alongside their children.';
      }
    } else if (age <= 6) {
      rec.tier = 'Tier 1: Early Childhood / Sprouts Programs';
      if (exp === 'early-suzuki' || age >= 3) {
        rec.group = 'Suzuki Sprouts (Ages 3–7)';
        rec.details = 'Focuses on pre-reading group violin learning, posture, rhythm, active listening, and basic Suzuki repertoire.';
      } else {
        rec.group = 'Sound Sprouts (Ages 0–6)';
        rec.details = 'A parent-child music movement & theory class using scarves, rhythm instruments, and ear-training exercises.';
      }
    } else if (age >= 7) {
      if (exp === '1-plus-years' && age >= 8) {
        rec.tier = 'Tier 3: Youth Orchestra';
        rec.group = 'Youth Orchestra (Ages 8–13)';
        rec.details = 'Main ensemble for students with 1–2+ years experience. Performs multi-part orchestral arrangements and collaborates with the Sequim Community Orchestra.';
      } else if (exp === 'under-1-year') {
        rec.tier = 'Tier 2: Core String Ensembles';
        rec.group = 'Intermediate Strings (Ages 7+)';
        rec.details = 'For students who have completed basic fundamentals and need continued support with reading staff notation and multi-part harmony.';
      } else {
        rec.tier = 'Tier 2: Core String Ensembles';
        rec.group = 'Beginner Strings (Ages 7+)';
        rec.details = 'For first-time players with no prior musical background. Teaches instrument mechanics, bow control, and reading standard staff notation.';
      }
    }

    // Render output
    const outputDiv = document.getElementById('recommendation-output');
    outputDiv.innerHTML = `
      <div class="result-card">
        <span class="result-badge">${rec.tier}</span>
        <h3>${rec.group}</h3>
        <p>${rec.details}</p>
        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 1rem 0;">
        <p style="font-size: 0.9rem; color: #475569;">${rec.locationNote}</p>
      </div>
    `;
  }
</script>

</body>
</html>
